[project]
name = "oykos-newsletter"
version = "1.0.0"
description = "AI-powered operational intelligence newsletter for Italian pediatricians (PLS)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Oykomed" }]
keywords = ["newsletter", "pediatrics", "ai", "openai", "italy"]
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.21,<1",
    "asyncpg>=0.30,<1",
    "alembic>=1.15,<2",
    "openai>=1.82,<2",
    "httpx>=0.28,<1",
    "feedparser>=6.0,<7",
    "beautifulsoup4>=4.12,<5",
    # Programme PDFs are where events state target professions, ECM credits and
    # registration deadlines. Reinstated 2026-08-07 per editorial feedback 6.2.
    "pypdf>=5.1,<7",
    "jinja2>=3.1,<4",
    "python-dotenv>=1.0,<2",
    "python-json-logger>=3.1,<4",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
oykos = "oykos.__main__:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6.0,<7",
    "ruff>=0.11,<1",
    "pyright>=1.1,<2",
    "httpx[http2]>=0.28,<1",
    "respx>=0.22,<1",
    "factory-boy>=3.3,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oykos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --tb=short"

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "T20", "ICN", "PIE", "PT", "RSE", "RET", "SLF", "SIM", "TID", "ARG", "PTH", "ERA"]
ignore = [
    "S101",    # assert is how pytest works
    "UP042",   # (str, Enum) is the project convention, see docs/data-model.md
]

[tool.ruff.lint.per-file-ignores]
# The source registry is a data table: one source per line is more readable
# than a wrapped literal. Same for the ORM column declarations.
"src/oykos/models/source.py" = ["E501"]
"src/oykos/db/tables.py" = ["E501"]
# Templates embed HTML/CSS that must not be reflowed.
"src/oykos/newsletter/template.py" = ["E501"]
"src/oykos/alerts/template.py" = ["E501"]
"src/oykos/web/design.py" = ["E501"]
"src/oykos/web/public.py" = ["E501"]
"src/oykos/web/review.py" = ["E501"]
# Tests use long fixture literals and dummy credentials.
"tests/**" = ["E501", "S105", "S106", "SLF001", "ARG001", "ARG002", "PT019"]

[tool.ruff.lint.isort]
known-first-party = ["oykos"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["src"]
# Pydantic's `Field(default_factory=list)` and the untyped feedparser/bs4 APIs
# make strict mode report "partially unknown" types on declarations that are
# already explicitly annotated. Everything else in strict stays on.
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportMissingTypeStubs = "none"

[tool.coverage.run]
source = ["src/oykos"]
omit = ["*/migrations/*"]

[tool.coverage.report]
# The suite deliberately targets the critical paths (editorial logic, grounding,
# alert cap, delivery privacy, subscriber security, end-to-end pipeline) rather
# than chasing line coverage across glue code.
fail_under = 65
show_missing = true
