[project]
name = "oykos-newsletter"
version = "1.0.0"
description = "AI-powered operational intelligence newsletter for Italian pediatricians (PLS)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Oykomed" }]
keywords = ["newsletter", "pediatrics", "ai", "openai", "italy"]

[project.scripts]
oykos = "oykos.__main__:cli"

dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.21,<1",
    "asyncpg>=0.30,<1",
    "alembic>=1.15,<2",
    "openai>=1.82,<2",
    "httpx>=0.28,<1",
    "feedparser>=6.0,<7",
    "beautifulsoup4>=4.12,<5",
    "jinja2>=3.1,<4",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6.0,<7",
    "ruff>=0.11,<1",
    "pyright>=1.1,<2",
    "httpx[http2]>=0.28,<1",
    "respx>=0.22,<1",
    "factory-boy>=3.3,<4",
]
prod = [
    "pgvector>=0.3,<1",
    "prefect>=3.4,<4",
    "sendgrid>=6.11,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oykos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --tb=short"

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "T20", "ICN", "PIE", "PT", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA"]
ignore = ["S101"]  # Allow assert in tests

[tool.ruff.lint.isort]
known-first-party = ["oykos"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.coverage.run]
source = ["src/oykos"]
omit = ["*/migrations/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
